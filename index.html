<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - Modern Landing Page</title>
  <meta name="description" content="A premium, visually stunning, client-side serverless Hello World landing page built with pure HTML, CSS, and vanilla JS.">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Background Canvas for Particles -->
  <canvas id="bg-canvas"></canvas>

  <!-- Visual Blur Blobs -->
  <div class="blur-blob blob-1"></div>
  <div class="blur-blob blob-2"></div>

  <!-- Main Container -->
  <div class="container">
    
    <!-- Top Header -->
    <header>
      <div class="logo">
        LineAlign<span class="logo-dot"></span>
      </div>
      
      <!-- Theme Switcher -->
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
        <!-- Icon is dynamically injected by main.js -->
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.6-.1 1.2.4 1.1 1-.1.4-.4.8-.7 1.1-3.4 3.4-3.4 9 0 12.4.3.3.6.7.7 1.1.1.6-.4 1.2-1.1 1.2zm-1.8-2.1c2-.7 3.5-2.2 4.4-4.1-3.8-1.5-6.6-4.9-7-9-2.1 1.6-3.4 4.1-3.4 7 0 4.4 3.6 8 8 8.1z"/>
        </svg>
      </button>
    </header>

    <!-- Main Card Body -->
    <main>
      <div class="card-wrapper">
        <div class="glass-card">
          <!-- Pulse Badge -->
          <div class="badge">
            <span class="badge-dot"></span>
            Hello Universe
          </div>

          <!-- Dynamic Text Heading -->
          <h1>Hello World</h1>

          <!-- Typewritten Tagline -->
          <p class="tagline" id="typewriter-tagline">
            <!-- Dynamically typed by main.js -->
          </p>

          <!-- Interactive Button -->
          <a href="#" class="cta-button" id="cta-btn">
            Get Started
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </main>

    <!-- Popup Toast Feedback -->
    <div class="toast" id="toast">
      <div class="toast-icon">✓</div>
      <div class="toast-content">
        <h4>Interaction Successful</h4>
        <p>You have triggered the dynamic landing page toast! 🎉</p>
      </div>
    </div>

    <!-- Bottom Footer -->
    <footer>
      <p>&copy; 2026 LineAlign Dental Lab. All rights reserved.</p>
      <div class="footer-links">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="https://linealign.in" target="_blank" rel="noopener">LineAlign</a>
      </div>
    </footer>

  </div>

  <!-- Controller Script -->
  <script src="js/main.js"></script>
</body>
</html>
