name: Deploy to cPanel (Multi-Domain)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "linealign_in"
            name: "LineAlign.in"
            host_secret: "CPANEL_HOST_1"
            ftp_user: "deploy@linealign.in"
          - target: "linealigndental_com"
            name: "LineAlignDental.com"
            host_secret: "CPANEL_HOST_2"
            ftp_user: "deploy@linealigndental.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Optional build step (conditional on package.json presence)
      - name: Build Project
        run: |
          if [ -f package.json ]; then
            echo "package.json found. Installing dependencies and building..."
            npm ci
            npm run build
            echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          else
            echo "No package.json found. Proceeding with static files."
            echo "DEPLOY_DIR=." >> $GITHUB_ENV
          fi

      # Syntax verification to block deployment on errors
      - name: Verify Code Quality & Syntax
        run: |
          echo "=== Checking JS Syntax ==="
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            const path = require('path');
            function walk(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              list.forEach(file => {
                file = path.join(dir, file);
                const stat = fs.statSync(file);
                if (stat && stat.isDirectory()) {
                  if (!file.includes('node_modules') && !file.includes('.git') && !file.includes('.github')) {
                    results = results.concat(walk(file));
                  }
                } else if (file.endsWith('.js')) {
                  results.push(file);
                }
              });
              return results;
            }
            const files = walk('.');
            let errors = 0;
            files.forEach(file => {
              try {
                const code = fs.readFileSync(file, 'utf8');
                new vm.Script(code);
              } catch (e) {
                console.error('✗ JS Syntax Error in ' + file + ':', e.message);
                errors++;
              }
            });
            if (errors > 0) {
              console.error('Validation failed: JS syntax errors found.');
              process.exit(1);
            }
            console.log('✓ All JS files passed syntax check.');
          "

          echo "=== Checking HTML Structure ==="
          npx htmlhint "**/*.html" --ignore "node_modules/**"

      # Deploy step via FTP/FTPS
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets[matrix.host_secret] }}
          username: ${{ matrix.ftp_user }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ${{ env.DEPLOY_DIR }}/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/logs/**
            **/tmp/**
            **/backups/**
            **/mail/**
            **/ssl/**
            **/.cpanel/**
            **/.deploy-exclude
            **/README.md
            **/vercel.json
            **/AGENTS.md
            **/.github/**
